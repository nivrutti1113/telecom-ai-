global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: prediction-api
    metrics_path: /metrics
    static_configs:
      - targets: ["prediction-api:8001"]

  - job_name: auth-service
    metrics_path: /metrics
    static_configs:
      - targets: ["auth-service:8000"]

  - job_name: telemetry-service
    metrics_path: /metrics
    static_configs:
      - targets: ["telemetry-service:8000"]
